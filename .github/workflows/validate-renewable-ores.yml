name: "Renewable Resource Validation"

on:
  pull_request:
    branches:
      - dev
      - "nstut/**"
    paths:
      - "kubejs/server_scripts/tfg/ores_and_materials/recipes.renewable_ores.js"
      - "kubejs/server_scripts/tfg/ores_and_materials/tags.materials.js"
      - "kubejs/startup_scripts/tfg/materials/materials.renewable_ores.js"
      - "kubejs/server_scripts/tfg/recipes.js"
      - "kubejs/startup_scripts/tfg/materials.js"
      - "kubejs/assets/tfg/lang/en_us.json"
      - "pakku-lock.json"
      - ".github/scripts/validate_renewable_ores.py"
      - ".github/workflows/validate-renewable-ores.yml"
  push:
    branches:
      - dev
      - "nstut/**"
    paths:
      - "kubejs/server_scripts/tfg/ores_and_materials/recipes.renewable_ores.js"
      - "kubejs/server_scripts/tfg/ores_and_materials/tags.materials.js"
      - "kubejs/startup_scripts/tfg/materials/materials.renewable_ores.js"
      - "kubejs/server_scripts/tfg/recipes.js"
      - "kubejs/startup_scripts/tfg/materials.js"
      - "kubejs/assets/tfg/lang/en_us.json"
      - "pakku-lock.json"
      - ".github/scripts/validate_renewable_ores.py"
      - ".github/workflows/validate-renewable-ores.yml"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Validate renewable resource chains
        run: python3 .github/scripts/validate_renewable_ores.py
